name: Seller dashboard browser required

on:
  pull_request:
    paths:
      - 'seller-dashboard-demo.html'
      - 'tests/test_seller_dashboard_browser_e2e.py'
      - '.github/workflows/seller-dashboard-browser-required.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Chromium browser E2E (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser suite; fail if skipped
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              start_dir="tests", pattern="test_seller_dashboard_browser_e2e.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < 8 or result.skipped or not result.wasSuccessful():
              print(
                  "RELEASE GATE FAILED: required Chromium E2E must run "
                  "all 8 tests without skip/failure",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("Chromium E2E gate passed: 8 tests executed, 0 skipped")
          PY
