name: Codex guarded review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-review
  cancel-in-progress: false
jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check API key configured
        env:
          CODEX_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY repository Actions secret before running"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Review repository without publishing changes
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/review-prompt.md
          output-file: codex-review.txt
      - name: Save private review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.run_id }}
          path: codex-review.txt
          if-no-files-found: ignore
          retention-days: 3
