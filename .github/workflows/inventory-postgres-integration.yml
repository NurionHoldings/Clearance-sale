name: Inventory PostgreSQL integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: Inventory PostgreSQL integration (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: inventory_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INVENTORY_TEST_DATABASE_URL: postgresql://inventory_test:local_ci_only@localhost:5432/inventory_test_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run real PostgreSQL integration tests and reject skips
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              start_dir="tests", pattern="test_postgres_inventory_integration.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or result.skipped or not result.wasSuccessful():
              print("RELEASE GATE FAILED: all 3 PostgreSQL tests must pass without skips", file=sys.stderr)
              sys.exit(1)
          print("PostgreSQL integration gate passed")
          PY
