name: Codex guarded change proposal
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Approved small development task (no secrets or customer data)"
        required: true
        type: choice
        options:
          - seller-dashboard-tests
          - inventory-invariant-tests
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API credential exists
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$API_KEY"
      - name: Run tests before Codex
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
      - name: Select approved task
        shell: bash
        env:
          APPROVED_TASK: ${{ inputs.task }}
        run: |
          case "$APPROVED_TASK" in
            seller-dashboard-tests|inventory-invariant-tests) ;;
            *) echo "::error::Unsupported task"; exit 1 ;;
          esac
          case "$APPROVED_TASK" in
            seller-dashboard-tests) printf "\nApproved task: improve seller dashboard tests only.\n" >> .github/codex/change-prompt.md ;;
            inventory-invariant-tests) printf "\nApproved task: improve inventory invariant tests only.\n" >> .github/codex/change-prompt.md ;;
          esac
      - name: Record approved prompt checksum
        shell: bash
        run: echo "APPROVED_PROMPT_SHA=$(sha256sum .github/codex/change-prompt.md | cut -d\x27 \x27 -f1)" >> "$GITHUB_ENV"
      - name: Codex proposes isolated changes
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/change-prompt.md
      - name: Enforce allowed change paths
        shell: bash
        run: |
          test "$(sha256sum .github/codex/change-prompt.md | cut -d\x27 \x27 -f1)" = "$APPROVED_PROMPT_SHA" || { echo "::error::Approved prompt was modified"; exit 1; }
          python - <<'PY'
          import subprocess, sys
          changed = subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"], text=True).splitlines()
          paths = [line[3:] for line in changed]
          disallowed = [p for p in paths if not (p.startswith("backend/") or p.startswith("tests/") or p == ".github/codex/change-prompt.md")]
          if disallowed:
              print("::error::Disallowed changes: " + ", ".join(disallowed))
              sys.exit(1)
          PY
      - name: Test proposed changes
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
          if [ -d backend ]; then python -m compileall -q backend; fi
      - name: Export diff for human review
        shell: bash
        run: |
          git add -N -- backend/ tests/
          git diff --binary -- backend/ tests/ > proposed.patch
          git diff --stat -- backend/ tests/
          test -s proposed.patch || echo "::warning::No changes were proposed"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-proposed-patch-${{ github.run_id }}
          path: proposed.patch
          retention-days: 3
