name: demo-gate
on:
  push:
  pull_request:
jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Block live-trade UI and invalid catalog
        run: node scripts/production-gate.mjs
      - name: Verify menswear filters and inventory invariants
        run: node --test tests/menswear-data.test.mjs tests/taxonomy.test.mjs tests/capacity.test.mjs tests/arirang.test.mjs tests/navigation.test.mjs
      - name: Check browser module syntax
        run: |
          node --check js/app.js
          node --check js/product-drafts.js
          node --check js/menswear-page.js
          node --check js/arirang-page.js
          node --check js/home-ui.js
          node --check js/navigation.mjs
          node --check js/showcase.js
      - name: Reject production release flag
        env:
          CLEARANCE_PRODUCTION_RELEASE: '1'
        run: |
          if node scripts/production-gate.mjs; then
            echo "Production release must fail while commerce is unimplemented"
            exit 1
          fi
